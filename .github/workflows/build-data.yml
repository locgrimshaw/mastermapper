name: Build data layer

# Run this from the website: Actions tab -> "Build data layer" -> "Run workflow".
# It processes whatever you've put in data/raw/ into the map-ready file the
# site serves. If no raw data is present yet, it generates synthetic sample
# data so the map still shows something.

on:
  workflow_dispatch:        # the "Run workflow" button on the website
    inputs:
      include_prices:
        description: "Also add house prices (slower — downloads a year of Land Registry data)"
        type: boolean
        default: false

permissions:
  contents: write           # lets the Action commit the processed file back

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

- name: Build the data layer (real data if present, else sample)
        run: |
          if [ -f data/raw/imd2019_scores.csv ]; then
            echo "IMD data found — fetching boundaries from ONS, then building real layer."
            python pipeline/fetch_boundaries.py
            python pipeline/build_imd_layer.py
          elif grep -qE '"lsoa_code" *: *"E[0-9]' web/data/lsoa_imd.geojson 2>/dev/null; then
            echo "No IMD CSV uploaded, but a REAL England layer already exists."
            echo "Refusing to overwrite it with synthetic sample data. Nothing to do."
            echo "To rebuild from scratch, upload data/raw/imd2019_scores.csv first."
          else
            echo "No IMD data and no real layer — generating synthetic sample so the map works."
            python pipeline/make_sample_data.py
          fi

      - name: Add house prices (optional)
        if: ${{ inputs.include_prices && hashFiles('data/raw/imd2019_scores.csv') != '' }}
        run: |
          echo "Adding house-price overlay from Land Registry + ONS lookup..."
          python pipeline/build_price_layer.py

      - name: Commit the processed layer
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f web/data/lsoa_imd.geojson
          git commit -m "Build data layer [automated]" || echo "No changes to commit"
          git push
