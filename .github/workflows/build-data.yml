name: Build data layer

on:
  workflow_dispatch:
    inputs:
      include_prices:
        description: "Also add house prices (slower - downloads a year of Land Registry data)"
        type: boolean
        default: false
      include_rail:
        description: "Also add the rail overlay (passenger lines from OpenStreetMap + stations from CSV)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Build the data layer
        run: |
          if [ -f data/raw/imd2019_scores.csv ]; then
            echo "IMD data found - fetching boundaries, building real layer."
            python pipeline/fetch_boundaries.py
            python pipeline/build_imd_layer.py
          elif grep -qE '"lsoa_code" *: *"E[0-9]' web/data/lsoa_imd.geojson 2>/dev/null; then
            echo "No IMD CSV uploaded, but a real England layer already exists."
            echo "Refusing to overwrite it with synthetic sample data."
            echo "To rebuild, upload data/raw/imd2019_scores.csv first."
          else
            echo "No IMD data and no real layer - generating synthetic sample."
            python pipeline/make_sample_data.py
          fi

      - name: Add house prices (optional)
        if: ${{ inputs.include_prices && hashFiles('data/raw/imd2019_scores.csv') != '' }}
        run: |
          echo "Adding house-price overlay from Land Registry + ONS lookup..."
          python pipeline/build_price_layer.py

      - name: Add rail overlay (optional)
        if: ${{ inputs.include_rail }}
        run: |
          echo "Building rail overlay: passenger lines (OSM/Overpass) + stations (CSV)..."
          python pipeline/build_rail_layer.py

      - name: Install tippecanoe (for vector tiles)
        run: pip install tippecanoe

      - name: Build vector tiles
        run: |
          echo "Converting GeoJSON to PMTiles for fast on-demand loading..."
          python pipeline/build_tiles.py

      - name: Commit the processed layer + tiles
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f web/data/lsoa_imd.geojson web/data/lsoa.pmtiles web/data/breaks.json
          git add -f web/data/rail.geojson 2>/dev/null || true
          git commit -m "Build data layer + tiles [automated]" || echo "No changes to commit"
          git push