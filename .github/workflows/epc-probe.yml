name: EPC endpoint probe

# Diagnostic only: shows what the "Get energy performance of buildings data"
# API returns for our credentials — HTTP status, redirect target host, content
# type and the first body bytes (never the credentials). The old
# epc.opendatacommunities.org service was retired 30 May 2026; the new API
# authenticates with `Authorization: Bearer <token>` (token from the signed-in
# my-account page) and serves the bulk file via a 302 to a pre-signed S3 URL.
# Used to verify credentials in ~1 minute instead of a full load-ppd cycle.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe bulk endpoints
        env:
          EPC_EMAIL: ${{ secrets.EPC_EMAIL }}
          EPC_API_KEY: ${{ secrets.EPC_API_KEY }}
        run: |
          if [ -z "$EPC_API_KEY" ]; then
            echo "::error::EPC_API_KEY secret not set"; exit 1
          fi
          API=https://api.get-energy-performance-data.communities.gov.uk
          probe () {  # probe <label> <url> <extra curl args...>
            local label="$1" url="$2"; shift 2
            echo "===== $label — $url"
            curl -sS -D /tmp/h -o /tmp/b --max-time 90 "$@" "$url" || true
            # Headers only (status, content-type, location host) — no cookies.
            grep -iE '^(HTTP|content-type|content-length|location)' /tmp/h || true
            echo "--- body: $(wc -c < /tmp/b) bytes; starts:"
            head -c 300 /tmp/b | tr -d '\0' | sed 's/[^[:print:]]/./g'; echo; echo
          }
          probe "bulk file info, Bearer" "$API/api/files/domestic/csv/info" \
            -H "Authorization: Bearer $EPC_API_KEY" -H "Accept: application/json"
          probe "bulk file HEAD-ish, Bearer, no redirect follow" \
            "$API/api/files/domestic/csv" \
            -H "Authorization: Bearer $EPC_API_KEY" -r 0-0
          if [ -n "$EPC_EMAIL" ]; then
            AUTH=$(printf '%s:%s' "$EPC_EMAIL" "$EPC_API_KEY" | base64 -w0)
            probe "bulk file info, legacy Basic" "$API/api/files/domestic/csv/info" \
              -H "Authorization: Basic $AUTH" -H "Accept: application/json"
          fi
