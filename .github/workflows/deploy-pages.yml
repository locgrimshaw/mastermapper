name: Deploy map to Pages

# Publishes the web/ folder as your live public site.
# Runs automatically whenever main changes (including after the data build).
# One-time setup on the website: Settings -> Pages -> Source -> "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:   # lets the build workflow publish directly after a build

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The site needs the vector tiles + the breaks sidecar + the small
      # standalone layers the frontend fetches at runtime (stations.geojson).
      # The LARGE raw GeoJSON sources (lsoa_imd.geojson — ~80-150MB at 20m
      # boundaries; rail.geojson ~25MB, already baked into the tiles) are build
      # inputs, not site assets — drop only those so each deploy stays small.
      - name: Trim build-only data from the publish folder
        run: |
          rm -f web/data/lsoa_imd.geojson web/data/rail.geojson web/data/simd.geojson
          echo "Publishing web/ with:"
          ls -lh web/data/ || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4