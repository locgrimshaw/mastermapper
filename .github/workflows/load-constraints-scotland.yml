name: Load Scotland constraints into Supabase

# Loads Scotland-specific designations into planning_constraints under the SAME
# canonical kinds as England (sssi, sac, spa, ramsar, ancient_woodland,
# scheduled_monument, listed_building, conservation_area, park_garden) plus
# national_scenic_area + national_park. NatureScot (WFS) and Historic Environment
# Scotland (ArcGIS) are discovered + paged automatically by
# build_scot_designations.py. Green belt + SEPA flood are optional URL inputs.
# The OS GB base layers (built_land/green_space/transport/water) come from the
# normal load-constraints run, whose station mask already covers Scotland.

on:
  workflow_dispatch:
    inputs:
      green_belt_url:
        description: "Optional: Scottish green belt GeoJSON URL"
        type: string
        default: ""
      flood_high_url:
        description: "Optional: SEPA river+coastal HIGH-likelihood flood GeoJSON URL (-> flood_zone_3)"
        type: string
        default: ""
      flood_med_url:
        description: "Optional: SEPA river+coastal MEDIUM-likelihood flood GeoJSON URL (-> flood_zone_2)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Download Scottish designations (NatureScot WFS + HES ArcGIS)
        run: python pipeline/build_scot_designations.py || echo "::warning::some designations failed"

      - name: Fetch optional green belt + SEPA flood
        run: |
          mkdir -p data/raw
          if [ -n "${{ inputs.green_belt_url }}" ]; then
            curl -fL --retry 3 -o data/raw/scot_green_belt.geojson "${{ inputs.green_belt_url }}" || echo "::warning::green belt failed"
          fi
          if [ -n "${{ inputs.flood_high_url }}" ]; then
            curl -fL --retry 3 -o data/raw/scot_flood_3.geojson "${{ inputs.flood_high_url }}" || echo "::warning::flood high failed"
          fi
          if [ -n "${{ inputs.flood_med_url }}" ]; then
            curl -fL --retry 3 -o data/raw/scot_flood_2.geojson "${{ inputs.flood_med_url }}" || echo "::warning::flood med failed"
          fi

      - name: Build the Scotland constraints CSV
        run: |
          K=$(cd data/raw && ls scot_*.geojson 2>/dev/null | sed 's/\.geojson$//' | paste -sd, -)
          if [ -z "$K" ]; then echo "::error::No Scottish designation files produced."; exit 1; fi
          echo "Building kinds: $K"
          CONSTRAINT_KINDS="$K" python pipeline/build_constraints.py

      - name: Load into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL / SUPABASE_SERVICE_KEY secrets"; exit 1; fi
          python supabase/loaders/load_constraints.py
