name: Rebuild market aggregates (price grid + affordability)

# Re-runs the two post-load aggregations WITHOUT reloading the 2M-row
# ppd_sales dataset (which takes ~50 minutes). Use when a load-ppd run's
# rebuild step failed, or after applying a migration that changes what the
# grid carries. Both functions fully replace their datasets, so this is
# idempotent and safe to run at any time.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Rebuild price_grid and lad affordability
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL / SUPABASE_SERVICE_KEY secrets."
            exit 1
          fi
          # --fail-with-body: an HTTP error must fail the step, not print a
          # JSON error body into a green log (the 2026-08-05 failure mode).
          fail=0
          # One resolution per call — the four-band rebuild exceeds the API
          # gateway's ~120 s ceiling on 36 months of sales (migration 0052).
          for res in 0.32 0.08 0.02 0.005; do
            echo "— price_grid @ $res°"
            curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/rebuild_price_grid" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/json" -d "{\"p_res\": $res}" --max-time 1500 \
              || { echo "::error::price_grid rebuild @ $res failed"; fail=1; }
            echo ""
          done
          # Sold-price choropleths on real boundaries (LSOA close in, LAD
          # nationally): every Land Registry comparable inside each area ->
          # medians, EPC-measured £/m², houses/flats split, trend.
          # CHUNKED: a 2M-point-in-polygon join over all areas exceeds the API
          # gateway's ~120 s ceiling and returns 504 even though the statement
          # is healthy (same lesson as the four-band price grid). Each call
          # takes a hash-slice; part 0 clears the dataset first. National
          # percentile ranks span every area, so they cannot be computed
          # inside a slice. NOTE: nothing is stamped afterwards — the map
          # classes colour by NATIONAL DECILE BREAKPOINTS held in the
          # frontend, so no per-area percentile has to be written (updating
          # 33.7k geometry-bearing rows rewrote the whole table and could not
          # finish inside the gateway window).
          rebuild_chunked () {   # rebuild_chunked <fn> <dataset> <parts>
            local fn="$1" ds="$2" parts="$3" p
            for p in $(seq 0 $((parts - 1))); do
              echo "— $fn part $p/$parts"
              curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/$fn" \
                -H "apikey: $SUPABASE_SERVICE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
                -H "Content-Type: application/json" \
                -d "{\"p_part\": $p, \"p_parts\": $parts}" --max-time 1500 \
                || { echo "::error::$fn part $p failed — $ds is INCOMPLETE"; fail=1; }
              echo ""
            done
          }
          rebuild_chunked rebuild_lad_prices  lad_prices   6
          rebuild_chunked rebuild_lsoa_prices lsoa_prices 12
          curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/rebuild_lad_affordability" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" -d '{}' --max-time 1500 \
            || { echo "::error::lad_affordability rebuild failed"; fail=1; }
          exit $fail
