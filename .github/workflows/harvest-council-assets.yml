name: Harvest council asset registers (UPRN discovery)

# DISCOVERY RUN. This deliberately does NOT load anything into Supabase.
#
# The public-land layer currently places council holdings by postcode centroid,
# which is structurally lossy: CCOD holds 187,666 public land titles but only
# 120,789 distinct postcode+owner points, so 66,877 titles cannot be represented
# at all and a centroid often lands on the road rather than the site.
#
# A UPRN fixes that — it is a precise point on the actual property, and OS Open
# UPRN turns it into a coordinate for free. The open question is how many
# councils actually publish a register WITH UPRNs in a machine-readable format.
# Nobody can answer that from a spec; the Local Government Transparency Code
# requires publication but not a schema. So this run measures it, and the
# coverage report in the log is the deliverable.
#
# The harvested CSV is uploaded as an artifact so the follow-up join can reuse
# it without re-crawling a few hundred council websites.

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Semicolon-separated data.gov.uk search phrases (blank = defaults)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas openpyxl xlrd

      - name: Discover and harvest
        env:
          ASSET_QUERIES: ${{ inputs.queries }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p data/raw
          python pipeline/fetch_council_assets.py

      - name: Summarise what landed
        if: always()
        # Counted in Python, not awk. The previous shell one-liner nested double
        # quotes inside a YAML double-quoted string, so awk received an empty
        # pattern and reported "0 rows with a coordinate" while the harvester
        # had in fact written 283,764 — a summary that contradicted the run it
        # was summarising.
        run: |
          python - <<'PY'
          import csv, collections, pathlib, sys
          p = pathlib.Path("data/raw/council_assets.csv")
          if not p.exists():
              print("::warning::no council_assets.csv produced"); sys.exit(0)
          n = coord = uprn = 0
          per = collections.Counter()
          with p.open(newline="", encoding="utf-8") as fh:
              for r in csv.DictReader(fh):
                  n += 1
                  per[r["council"]] += 1
                  if r.get("lng"):
                      coord += 1
                  elif r.get("uprn"):
                      uprn += 1
          print(f"rows: {n:,}   distinct councils: {len(per):,}")
          print(f"located by coordinate: {coord:,}   by UPRN only: {uprn:,}")
          for c, k in per.most_common(20):
              print(f"  {k:>8,}  {c}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: council_assets_csv
          path: data/raw/council_assets.csv
          if-no-files-found: warn
