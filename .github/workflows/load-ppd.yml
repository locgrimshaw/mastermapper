name: Load Price Paid sales into Supabase

# Street-level price granularity: HM Land Registry Price Paid transactions for
# the last N months (default 12, ~800k sales) as the `ppd_sales` point
# dataset, geocoded by OS Code-Point Open. Re-run monthly — the loader fully
# replaces the dataset so the window rolls forward.
# Data: HM Land Registry Price Paid Data © Crown copyright and database right,
# under the PPD licence (display use, with attribution).

on:
  schedule:
    # Monthly (2nd, 02:40 UTC) — rolls the 36-month window forward and
    # re-aggregates the price heatmap grid.
    - cron: "40 2 2 * *"
  workflow_dispatch:
    inputs:
      months:
        description: "How many months of sales to keep (default 36)"
        required: false
        default: "36"

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Build the ppd_sales import CSV
        env:
          # `inputs` is empty on scheduled (cron) runs, so without the fallback
          # the monthly refresh silently ran a 12-month window while manual
          # runs used 36 — two different products from the same workflow.
          PPD_MONTHS: ${{ inputs.months || '36' }}
          # Optional EPC floor-area join (real £/m² instead of the type-mix
          # estimate): free account at epc.opendatacommunities.org, then add
          # these two repository secrets — see docs/MANUAL_TASKS.md 5c.
          EPC_EMAIL: ${{ secrets.EPC_EMAIL }}
          EPC_API_KEY: ${{ secrets.EPC_API_KEY }}
        run: python pipeline/build_ppd.py

      - name: Load into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATASETS: ppd_sales
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Missing SUPABASE_URL / SUPABASE_SERVICE_KEY secrets."
            exit 1
          fi
          python supabase/loaders/load_datasets.py

      - name: Rebuild the sold-price heatmap grid
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # --fail-with-body is load-bearing: without it curl exits 0 on an
          # HTTP 500, so on 2026-08-05 both rebuilds died on a statement
          # timeout, printed the JSON error into a green log, and the step
          # "succeeded" with a stale grid. PostgREST runs these with the
          # service_role statement_timeout (raised to 20min for exactly this).
          fail=0
          # Re-aggregate the price_grid ONE RESOLUTION PER CALL: the four-band
          # rebuild takes >120 s on 36 months of sales and the API gateway
          # hangs up at ~120 s (HTTP 504) whatever the role statement budget
          # says. Each band alone fits (migration 0052).
          for res in 0.32 0.08 0.02 0.005; do
            echo "— price_grid @ $res°"
            curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/rebuild_price_grid" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/json" -d "{\"p_res\": $res}" --max-time 1500 \
              || { echo "::error::price_grid rebuild @ $res failed — that band is STALE until 'select rebuild_price_grid($res)' succeeds"; fail=1; }
            echo ""
          done
          # Affordability ratios on lad_income (median 12m price ÷ ASHE income).
          # Depends on fresh ppd_sales, so it lives here rather than in the
          # datasets workflow; harmless no-op when lad_income is not yet loaded.
          # Sold-price choropleths on real boundaries (LSOA close in, LAD
          # nationally) — every Land Registry comparable inside each area,
          # medians + EPC-measured £/m² + national percentile ranks. Minutes
          # each: a 2M-point-in-polygon join. MUST run here rather than from a
          # SQL client, whose disconnect rolls the transaction back.
          for fn in rebuild_lad_prices rebuild_lsoa_prices; do
            echo "— $fn"
            curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/$fn" \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/json" -d '{}' --max-time 1500 \
              || { echo "::error::$fn failed — that choropleth is STALE"; fail=1; }
            echo ""
          done
          curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/rebuild_lad_affordability" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" -d '{}' --max-time 1500 \
            || { echo "::error::lad_affordability rebuild failed — run 'select rebuild_lad_affordability()' manually"; fail=1; }
          exit $fail
