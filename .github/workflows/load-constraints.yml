name: Load constraints into Supabase

# Builds the station developable-land constraint polygons (built land, green
# space, transport corridors, flood zones, green belt) and loads them into your
# Supabase `planning_constraints` table. You trigger this with a button in the
# GitHub "Actions" tab — no command line needed. It reads your Supabase keys
# from repository Secrets, so they never appear in your code.
#
# SOURCE DOWNLOADS MUST BE PRESENT. build_constraints.py clips the constraint
# layers to a 1 km buffer around every rail station, so it needs the raw
# national datasets as input. Each source is OPTIONAL (missing ones are skipped
# with a warning), but you get a useful result only for the sources you provide.
# Two ways to supply them:
#   (a) Commit the downloads under data/raw/ (they're allowlisted in
#       .gitignore). Expected default filenames (configurable via env vars —
#       see the header of pipeline/build_constraints.py):
#         data/raw/os_open_built_up_areas.gpkg   (OS Open Built Up Areas)
#         data/raw/os_open_greenspace.gpkg       (OS Open Greenspace)
#         data/raw/os_openmap_local.gpkg         (OS OpenMap Local: Road + Rail)
#         data/raw/ea_flood_zone_2.gpkg          (EA Flood Zone 2)
#         data/raw/ea_flood_zone_3.gpkg          (EA Flood Zone 3)
#         data/raw/green-belt.geojson            (planning.data.gov.uk green-belt)
#   (b) Add a download step below (curl the Defra/OS Data Hub/planning.data URLs
#       into data/raw/) — CI has open internet. See docs/DATASETS.md for links.

on:
  workflow_dispatch:
    inputs:
      kinds:
        description: "Which constraint kinds to build (comma-separated, blank = all)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # geopandas installs binary wheels (shapely/pyogrio/pyproj bundle their
      # own GDAL/GEOS/PROJ), so no apt GDAL is normally required. If a wheel is
      # ever unavailable for the runner, uncomment the apt step below.
      # - name: System GDAL (fallback only)
      #   run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Download constraint sources (best effort; missing ones skip)
        run: |
          mkdir -p data/raw data/raw/os
          # --- planning.data.gov.uk green belt (OGL v3.0, already 4326) --------
          echo "green-belt..."
          curl -fL --retry 3 --retry-delay 5 -o data/raw/green-belt.geojson \
            "https://files.planning.data.gov.uk/dataset/green-belt.geojson" \
            || echo "::warning::green-belt download failed"
          # --- OS OpenData via the OS Data Hub Downloads API (no key needed) ---
          # Delivered as a zip; we unzip, find the .gpkg, and point the builder's
          # env var at it. Best effort — a failure just skips that kind.
          osdl() {
            prod="$1"; var="$2"
            echo "OS $prod..."
            if curl -fL --retry 2 --retry-delay 5 -o "data/raw/os/$prod.zip" \
                 "https://api.os.uk/downloads/v1/products/$prod/downloads?area=GB&format=GeoPackage&redirect"; then
              unzip -o -q "data/raw/os/$prod.zip" -d "data/raw/os/$prod" || true
              gpkg=$(find "data/raw/os/$prod" -iname '*.gpkg' | head -1)
              if [ -n "$gpkg" ]; then echo "$var=$gpkg" >> "$GITHUB_ENV"; echo "  -> $gpkg"; \
                else echo "::warning::no .gpkg inside $prod.zip"; fi
            else echo "::warning::OS $prod download failed"; fi
          }
          osdl BuiltUpAreas   BUILT_LAND_SRC
          osdl OpenGreenspace GREEN_SPACE_SRC
          # OpenMap Local is a 3.3 GB GeoPackage — only fetch it when 'transport'
          # is explicitly requested via the kinds input (keeps default runs fast).
          if echo "${{ inputs.kinds }}" | grep -q transport; then
            osdl OpenMapLocal TRANSPORT_ROAD_SRC
            rd=$(find data/raw/os/OpenMapLocal -iname '*.gpkg' 2>/dev/null | head -1)
            if [ -n "$rd" ]; then echo "TRANSPORT_RAIL_SRC=$rd" >> "$GITHUB_ENV"; fi
          else
            echo "transport not in kinds -> skipping the 3.3 GB OpenMap Local download."
          fi
          # --- EA Flood Map for Planning Flood Zones (best effort) ------------
          # The Defra DSP national download is not a stable unauthenticated URL;
          # if this fails, commit data/raw/ea_flood_zones.gpkg manually. Flood
          # zones then simply aren't subtracted until provided.
          echo "Downloaded so far:"; ls -lhR data/raw | head -40 || true

      - name: Check at least one source download is present
        run: |
          # Robust check: pass if green-belt downloaded OR any OS source env var
          # points at a real file (set by the download step via $GITHUB_ENV).
          ok=0
          [ -f data/raw/green-belt.geojson ] && ok=1
          for v in "$BUILT_LAND_SRC" "$GREEN_SPACE_SRC" "$TRANSPORT_ROAD_SRC"; do
            [ -n "$v" ] && [ -f "$v" ] && ok=1
          done
          if [ "$ok" -eq 0 ]; then
            echo "::error::No constraint sources downloaded — see the download step logs."
            exit 1
          fi
          echo "At least one constraint source is present — proceeding."

      - name: Build the constraints import CSV
        env:
          CONSTRAINT_KINDS: ${{ inputs.kinds }}
        run: |
          echo "Building supabase/constraints_import.csv (clipped to station catchments)"
          python pipeline/build_constraints.py

      - name: Upload import CSV as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: constraints_import_csv
          path: supabase/constraints_import.csv
          if-no-files-found: error

      - name: Load the constraints into Supabase
        env:
          # These come from your repository Secrets (Settings > Secrets and
          # variables > Actions). The service key is write-access and secret.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::Missing secrets. Add SUPABASE_URL and SUPABASE_SERVICE_KEY"
            echo "::error::under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          python supabase/loaders/load_constraints.py
