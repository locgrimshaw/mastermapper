name: Build data layer

on:
  workflow_dispatch:
    inputs:
      include_prices:
        description: "Also add house prices (slower - downloads a year of Land Registry data)"
        type: boolean
        default: false
      include_rail:
        description: "Also add the rail overlay (passenger lines from OpenStreetMap + stations from CSV)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Build the data layer
        env:
          # Boundary file source(s). The big LSOA file can exceed Supabase's
          # 50MB per-file limit, so it may be split into parts — list each
          # part's public URL as BOUNDARY_URL_1, _2, ... (or put a single URL,
          # or a comma-separated list, in BOUNDARY_URL). Set these under
          # Settings > Secrets and variables > Actions. If all are unset, the
          # build uses a committed file or the ONS API instead.
          BOUNDARY_URL: ${{ secrets.BOUNDARY_URL }}
          BOUNDARY_URL_1: ${{ secrets.BOUNDARY_URL_1 }}
          BOUNDARY_URL_2: ${{ secrets.BOUNDARY_URL_2 }}
          BOUNDARY_URL_3: ${{ secrets.BOUNDARY_URL_3 }}
          BOUNDARY_URL_4: ${{ secrets.BOUNDARY_URL_4 }}
          BOUNDARY_URL_5: ${{ secrets.BOUNDARY_URL_5 }}
          BOUNDARY_URL_6: ${{ secrets.BOUNDARY_URL_6 }}
        run: |
          if [ -f data/raw/imd2025_scores.csv ]; then
            echo "IMD data found - fetching boundaries, building real layer."
            python pipeline/fetch_boundaries.py
            python pipeline/build_imd_layer.py
          elif grep -qE '"lsoa_code" *: *"E[0-9]' web/data/lsoa_imd.geojson 2>/dev/null; then
            echo "No IMD CSV uploaded, but a real England layer already exists."
            echo "Refusing to overwrite it with synthetic sample data."
            echo "To rebuild, upload data/raw/imd2025_scores.csv first."
          else
            echo "No IMD data and no real layer - generating synthetic sample."
            python pipeline/make_sample_data.py
          fi

      - name: Add house prices (optional)
        if: ${{ inputs.include_prices && hashFiles('data/raw/imd2025_scores.csv') != '' }}
        run: |
          echo "Adding house-price overlay from Land Registry + ONS lookup..."
          python pipeline/build_price_layer.py

      - name: Add rail overlay (optional)
        if: ${{ inputs.include_rail }}
        run: |
          echo "Building rail overlay: passenger lines (OSM/Overpass) + stations (CSV)..."
          python pipeline/build_rail_layer.py

      - name: Add station usage (heavy-rail, optional)
        if: ${{ inputs.include_rail }}
        run: |
          echo "Building station-usage layer (ORR entries/exits joined to stations)..."
          python pipeline/build_station_usage.py

      - name: Install tippecanoe (for vector tiles)
        run: pip install tippecanoe

      - name: Build vector tiles
        run: |
          echo "Converting GeoJSON to PMTiles for fast on-demand loading..."
          python pipeline/build_tiles.py

      - name: Commit the processed layer + tiles
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          echo "=== Files on disk after build ==="
          ls -lh web/data/ || true

          echo "=== Is anything in web/data ignored by git? ==="
          git check-ignore -v web/data/* || echo "(nothing in web/data is ignored — good)"

          echo "=== Staging outputs ==="
          git add -f web/data/lsoa_imd.geojson web/data/lsoa.pmtiles web/data/breaks.json
          if [ -f web/data/rail.geojson ]; then
            git add -f web/data/rail.geojson
            echo "Staged rail.geojson ($(du -h web/data/rail.geojson | cut -f1))"
          else
            echo "No rail.geojson on disk (rail step was off or failed)."
          fi
          if [ -f web/data/stations.geojson ]; then
            git add -f web/data/stations.geojson
            echo "Staged stations.geojson ($(du -h web/data/stations.geojson | cut -f1))"
          else
            echo "No stations.geojson on disk (station step was off or failed)."
          fi

          echo "=== What is staged? ==="
          git status --short
          git diff --cached --stat

          echo "=== Commit + push (no-op safe) ==="
          if git diff --cached --quiet; then
            echo "Outputs identical to what's already committed — nothing to push."
          else
            git commit -m "Build data layer + tiles [automated]"
            git push
          fi

  # Always (re)publish the site after a build, even when the data commit was a
  # no-op. The data and deploy workflows are separate: deploy normally fires on
  # 'push', but a no-op build produces no push event, so the new tiles would
  # never go live. Calling deploy here guarantees publication every build.
  deploy:
    needs: build
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write